<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posts · Foro UTN FRT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <nav class="breadcrumb mb-3" id="breadcrumb" aria-label="Ubicación">
      <a href="/">Inicio</a>
    </nav>

    <section class="category-header card mb-4">
      <div class="min-w-0">
        <h1 id="category-name" class="text-2xl font-bold text-primary">Cargando…</h1>
        <p id="category-description" class="text-secondary text-sm mt-1"></p>
        <div id="subcategories" class="flex flex-wrap gap-2 mt-3"></div>
      </div>
      <button id="new-post-btn" type="button" onclick="showNewPostForm()" class="btn-primary px-5 py-2 rounded-full text-sm font-semibold whitespace-nowrap">
        + Nuevo post
      </button>
    </section>

    <section id="new-post-form" class="hidden card p-5 mb-4" aria-labelledby="new-post-title">
      <h2 id="new-post-title" class="text-lg font-semibold text-primary mb-4">Nuevo post</h2>
      <form id="create-post-form" class="space-y-3">
        <div>
          <label for="post-category" class="field-label">Categoría</label>
          <select id="post-category" name="category_id" required class="w-full input-field rounded-lg px-3 py-2 text-sm"></select>
        </div>
        <div>
          <label for="post-title" class="field-label">Título</label>
          <input id="post-title" type="text" name="title" required maxlength="200" placeholder="Un título claro ayuda a que te respondan"
                 class="w-full input-field rounded-lg px-3 py-2 text-sm">
        </div>
        <div>
          <label for="post-content" class="field-label">Contenido</label>
          <textarea id="post-content" name="content" required rows="6" maxlength="20000" placeholder="Contá tu duda, compartí el apunte o la idea…"
                    class="w-full input-field rounded-lg px-3 py-2 text-sm"></textarea>
        </div>
        <div>
          <span class="field-label">Etiquetas</span>
          <div id="tag-selector" class="flex flex-wrap gap-2"></div>
        </div>
        <div>
          <span class="field-label">Imagen (opcional)</span>
          <label class="file-drop">
            <input type="file" accept="image/jpeg,image/png,image/gif,image/webp" id="post-image-input" class="sr-only">
            <span id="file-drop-label">Elegí una imagen (JPG, PNG, GIF o WEBP, hasta 5MB)</span>
          </label>
          <div id="image-preview" class="mt-2"></div>
        </div>
        <div class="flex gap-2 justify-end pt-2">
          <button type="button" onclick="hideNewPostForm()" class="btn-ghost px-4 py-2 rounded-full text-sm">Cancelar</button>
          <button type="submit" id="publish-btn" class="btn-primary px-5 py-2 rounded-full text-sm font-semibold">Publicar</button>
        </div>
      </form>
    </section>

    <div class="layout">
      <div class="layout-main">
        <div class="flex items-center gap-2 mb-3 flex-wrap">
          <div class="sort-tabs" role="tablist" aria-label="Ordenar posts">
            <button type="button" class="sort-tab" data-sort="recent" role="tab">Recientes</button>
            <button type="button" class="sort-tab" data-sort="votes" role="tab">Más votados</button>
          </div>
          <form id="search-form" class="local-search ml-auto" role="search">
            <input type="search" id="search-input" placeholder="Buscar en esta categoría" maxlength="100" aria-label="Buscar en esta categoría"
                   class="input-field rounded-full px-4 py-1.5 text-sm">
          </form>
        </div>
        <div id="active-filters" class="flex flex-wrap gap-2 mb-3"></div>
        <div id="posts" class="space-y-3"></div>
        <div id="pagination"></div>
      </div>

      <aside class="layout-side">
        <div class="card p-4">
          <h2 class="side-title">Filtrar por etiqueta</h2>
          <div id="sidebar-tags" class="flex flex-wrap gap-2"></div>
        </div>
      </aside>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/posts.js"></script>
</body>
</html>
