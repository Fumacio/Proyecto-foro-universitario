<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta · Foro UTN FRT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-md mx-auto px-4 py-12">
    <div class="card auth-card">
      <div class="brand-logo auth-logo" aria-hidden="true">U</div>
      <h1 class="text-2xl font-bold text-primary text-center">Crear cuenta</h1>
      <p class="text-secondary text-sm text-center mt-1 mb-6">Sumate a la comunidad de la UTN FRT.</p>

      <form id="register-form" class="space-y-4">
        <div>
          <label for="username" class="field-label">Nombre de usuario *</label>
          <input id="username" type="text" name="username" required minlength="3" maxlength="30" autocomplete="username"
                 pattern="[A-Za-zÀ-ÿ0-9_.\-]+" title="Letras, números, punto, guion y guion bajo" class="w-full input-field rounded-lg px-3 py-2">
        </div>
        <div>
          <label for="email" class="field-label">Email *</label>
          <input id="email" type="email" name="email" required maxlength="100" autocomplete="email" class="w-full input-field rounded-lg px-3 py-2">
        </div>
        <div>
          <label for="password" class="field-label">Contraseña * <span class="text-muted font-normal">(mínimo 6 caracteres)</span></label>
          <input id="password" type="password" name="password" required minlength="6" maxlength="72" autocomplete="new-password" class="w-full input-field rounded-lg px-3 py-2">
        </div>

        <details class="group">
          <summary class="text-sm text-secondary cursor-pointer select-none">Datos opcionales del perfil</summary>
          <div class="space-y-4 mt-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="first_name" class="field-label">Nombre</label>
                <input id="first_name" type="text" name="first_name" maxlength="50" autocomplete="given-name" class="w-full input-field rounded-lg px-3 py-2">
              </div>
              <div>
                <label for="last_name" class="field-label">Apellido</label>
                <input id="last_name" type="text" name="last_name" maxlength="50" autocomplete="family-name" class="w-full input-field rounded-lg px-3 py-2">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="age" class="field-label">Edad</label>
                <input id="age" type="number" name="age" min="13" max="120" class="w-full input-field rounded-lg px-3 py-2">
              </div>
              <div>
                <label for="commission" class="field-label">Comisión</label>
                <input id="commission" type="text" name="commission" maxlength="30" placeholder="Ej: 1K3" class="w-full input-field rounded-lg px-3 py-2">
              </div>
            </div>
            <div>
              <label for="career" class="field-label">Carrera</label>
              <select id="career" name="career" class="w-full input-field rounded-lg px-3 py-2">
                <option value="">Seleccionar carrera</option>
              <option value="Ingenieria en Sistemas">Ingeniería en Sistemas</option>
              <option value="Ingenieria Civil">Ingeniería Civil</option>
              <option value="Ingenieria Electrica">Ingeniería Eléctrica</option>
              <option value="Ingenieria Mecanica">Ingeniería Mecánica</option>
              <option value="Ingenieria Quimica">Ingeniería Química</option>
              <option value="Licenciatura en Administracion">Licenciatura en Administración</option>
              <option value="Contador Publico">Contador Público</option>
              <option value="Otra">Otra</option>
              </select>
            </div>
            <div>
              <label for="gender" class="field-label">Género</label>
              <select id="gender" name="gender" class="w-full input-field rounded-lg px-3 py-2">
                <option value="">Prefiero no decir</option>
                <option value="Masculino">Masculino</option>
                <option value="Femenino">Femenino</option>
                <option value="No binario">No binario</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
          </div>
        </details>

        <button type="submit" class="w-full btn-primary py-2.5 rounded-full font-semibold">Crear cuenta</button>
      </form>

      <div id="msg" class="form-msg" role="alert"></div>

      <p class="text-center text-sm text-muted mt-4">
        ¿Ya tenés cuenta? <a href="/login.html" class="link-theme font-medium">Iniciá sesión</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/auth.js"></script>
  <script>initRegisterForm();</script>
</body>
</html>
