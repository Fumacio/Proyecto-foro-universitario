<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForoU - Recuperar Contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <div class="max-w-md mx-auto px-4 py-16">
    <div class="card rounded-lg p-8">
      <h1 class="text-2xl font-bold text-primary mb-2 text-center">Recuperar Contraseña</h1>
      <p class="text-secondary text-sm text-center mb-6">Ingresá tu email y te enviaremos un enlace para restablecer tu contraseña.</p>

      <form id="forgot-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-secondary mb-1">Email</label>
          <input type="email" name="email" required
                 class="w-full input-field rounded px-3 py-2" placeholder="tu@email.com">
        </div>
        <button type="submit" class="w-full btn-primary py-2 rounded font-medium">
          Enviar enlace
        </button>
      </form>

      <div id="msg" class="text-center mt-4"></div>

      <p class="text-center text-sm text-muted mt-6">
        <a href="/login.html" class="link-theme hover:underline">← Volver al login</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const form = e.target;

      try {
        await api.post('/auth/forgot-password', { email: form.email.value.trim() });
        msg.textContent = 'Si el email está registrado, recibirás un enlace de recuperación.';
        msg.style.color = 'var(--green)';
        form.reset();
      } catch (err) {
        msg.textContent = err.error || 'Error al procesar la solicitud';
        msg.style.color = 'var(--red)';
      }
    });
  </script>
</body>
</html>
