<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña · Foro UTN FRT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-md mx-auto px-4 py-12">
    <div class="card auth-card">
      <h1 class="text-2xl font-bold text-primary text-center">Recuperar contraseña</h1>
      <p class="text-secondary text-sm text-center mt-1 mb-6">Ingresá tu email y te mandamos un enlace para elegir una nueva.</p>

      <form id="forgot-form" class="space-y-4">
        <div>
          <label for="email" class="field-label">Email</label>
          <input id="email" type="email" name="email" required autocomplete="email" placeholder="tu@email.com" class="w-full input-field rounded-lg px-3 py-2">
        </div>
        <button type="submit" class="w-full btn-primary py-2.5 rounded-full font-semibold">Enviar enlace</button>
      </form>

      <div id="msg" class="form-msg" role="alert"></div>

      <p class="text-center text-sm mt-4">
        <a href="/login.html" class="link-theme">← Volver al login</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const form = e.target;
      const button = form.querySelector('button');
      button.disabled = true;

      try {
        const data = await api.post('/auth/forgot-password', { email: form.email.value.trim() });
        msg.textContent = data.message;
        msg.className = 'form-msg form-msg-success';
        form.reset();
      } catch (err) {
        msg.textContent = errorMessage(err, 'Error al procesar la solicitud');
        msg.className = 'form-msg form-msg-error';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
