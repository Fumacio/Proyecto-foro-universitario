<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post · Foro UTN FRT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-4xl mx-auto px-4 py-6">
    <nav class="breadcrumb mb-3" id="breadcrumb" aria-label="Ubicación">
      <a href="/">Inicio</a>
    </nav>

    <div id="post-detail">
      <div class="card p-6 space-y-3" aria-hidden="true">
        <div class="skeleton" style="height: 12px; width: 30%"></div>
        <div class="skeleton" style="height: 24px; width: 70%"></div>
        <div class="skeleton" style="height: 12px; width: 95%"></div>
        <div class="skeleton" style="height: 12px; width: 85%"></div>
      </div>
    </div>

    <section id="comments-section" class="mt-6 hidden" aria-labelledby="comments-title">
      <div class="card p-4 mb-4">
        <h2 id="comments-title" class="text-base font-semibold text-primary mb-3">Comentarios</h2>
        <form id="comment-form" class="space-y-2">
          <textarea name="content" placeholder="Escribí un comentario…" required rows="3" maxlength="10000" aria-label="Escribí un comentario"
                    class="w-full input-field rounded-lg px-3 py-2 text-sm"></textarea>
          <div class="flex justify-end">
            <button type="submit" class="btn-primary px-5 py-1.5 rounded-full text-sm font-semibold">Comentar</button>
          </div>
        </form>
      </div>

      <div id="comments" class="space-y-3"></div>
      <div id="comments-pagination"></div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
