<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForoU - Post</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <div class="max-w-4xl mx-auto px-4 py-8">
    <a href="/" class="link-theme hover:underline text-sm">← Volver al inicio</a>

    <div id="post-detail" class="mt-4">
      <p class="text-muted">Cargando post...</p>
    </div>

    <div id="comments-section" class="mt-8 hidden">
      <h2 class="text-lg font-semibold text-primary mb-4">Comentarios</h2>

      <div id="comment-form-container" class="mb-6">
        <form id="comment-form" class="space-y-2">
          <textarea name="content" placeholder="Escribí un comentario..." required rows="3"
                    class="w-full input-field rounded px-3 py-2 text-sm"></textarea>
          <button type="submit" class="btn-primary px-4 py-1.5 rounded text-sm">Comentar</button>
        </form>
      </div>

      <div id="comments" class="space-y-3">
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
