<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña · Foro UTN FRT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tailwind.css">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <main class="max-w-md mx-auto px-4 py-12">
    <div class="card auth-card">
      <h1 class="text-2xl font-bold text-primary text-center">Elegí una nueva contraseña</h1>
      <p class="text-secondary text-sm text-center mt-1 mb-6">Al cambiarla se cierran tus sesiones abiertas.</p>

      <form id="reset-form" class="space-y-4">
        <div>
          <label for="password" class="field-label">Nueva contraseña</label>
          <input id="password" type="password" name="password" required minlength="6" maxlength="72" autocomplete="new-password" placeholder="Mínimo 6 caracteres" class="w-full input-field rounded-lg px-3 py-2">
        </div>
        <div>
          <label for="confirm_password" class="field-label">Repetila</label>
          <input id="confirm_password" type="password" name="confirm_password" required minlength="6" maxlength="72" autocomplete="new-password" class="w-full input-field rounded-lg px-3 py-2">
        </div>
        <button type="submit" class="w-full btn-primary py-2.5 rounded-full font-semibold">Guardar contraseña</button>
      </form>

      <div id="msg" class="form-msg" role="alert"></div>

      <p class="text-center text-sm mt-4">
        <a href="/login.html" class="link-theme">← Volver al login</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const msgEl = document.getElementById('msg');
    const form = document.getElementById('reset-form');

    if (!token) {
      msgEl.textContent = 'El enlace no es válido. Pedí uno nuevo desde "¿La olvidaste?".';
      msgEl.className = 'form-msg form-msg-error';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = form.password.value;

      if (password !== form.confirm_password.value) {
        msgEl.textContent = 'Las contraseñas no coinciden';
        msgEl.className = 'form-msg form-msg-error';
        return;
      }

      try {
        await api.post('/auth/reset-password', { token, password });
        // La sesión guardada en este navegador ya no sirve (se invalidan todas)
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        msgEl.textContent = 'Listo, contraseña actualizada. Te llevamos al login…';
        msgEl.className = 'form-msg form-msg-success';
        setTimeout(() => { window.location.href = '/login.html'; }, 2000);
      } catch (err) {
        msgEl.textContent = errorMessage(err, 'Error al restablecer la contraseña');
        msgEl.className = 'form-msg form-msg-error';
      }
    });
  </script>
</body>
</html>
