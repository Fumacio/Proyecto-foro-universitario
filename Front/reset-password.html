<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ForoU - Restablecer Contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body class="min-h-screen">
  <div id="navbar"></div>

  <div class="max-w-md mx-auto px-4 py-16">
    <div class="card rounded-lg p-8">
      <h1 class="text-2xl font-bold text-primary mb-2 text-center">Restablecer Contraseña</h1>
      <p class="text-secondary text-sm text-center mb-6">Ingresá tu nueva contraseña.</p>

      <form id="reset-form" class="space-y-4">
        <input type="hidden" name="token" id="token">
        <div>
          <label class="block text-sm font-medium text-secondary mb-1">Nueva contraseña</label>
          <input type="password" name="password" required minlength="6"
                 class="w-full input-field rounded px-3 py-2" placeholder="Mínimo 6 caracteres">
        </div>
        <div>
          <label class="block text-sm font-medium text-secondary mb-1">Confirmar contraseña</label>
          <input type="password" name="confirm_password" required minlength="6"
                 class="w-full input-field rounded px-3 py-2" placeholder="Repetí tu contraseña">
        </div>
        <button type="submit" class="w-full btn-primary py-2 rounded font-medium">
          Restablecer contraseña
        </button>
      </form>

      <div id="msg" class="text-center mt-4"></div>

      <p class="text-center text-sm text-muted mt-6">
        <a href="/login.html" class="link-theme hover:underline">← Volver al login</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const msgEl = document.getElementById('msg');

    if (!token) {
      msgEl.textContent = 'Token no proporcionado. Solicitá uno nuevo.';
      msgEl.style.color = 'var(--red)';
      document.getElementById('reset-form').style.display = 'none';
    } else {
      document.getElementById('token').value = token;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const password = form.password.value;
      const confirmPassword = form.confirm_password.value;

      if (password !== confirmPassword) {
        msgEl.textContent = 'Las contraseñas no coinciden';
        msgEl.style.color = 'var(--red)';
        return;
      }

      try {
        await api.post('/auth/reset-password', { token, password });
        msgEl.textContent = 'Contraseña actualizada correctamente. Redirigiendo al login...';
        msgEl.style.color = 'var(--green)';
        setTimeout(() => { window.location.href = '/login.html'; }, 2000);
      } catch (err) {
        msgEl.textContent = err.error || 'Error al restablecer la contraseña';
        msgEl.style.color = 'var(--red)';
      }
    });
  </script>
</body>
</html>
